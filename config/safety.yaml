# CQUPT AI Assistant — Safety Guardrails Configuration
# Tune per-layer enable/disable, sensitivity, and custom blocklists.

layers:
  # --- Crisis Detection ---
  # Three-tier classification: immediate > high_risk > existential
  crisis:
    enabled: true
    # low = only immediate triggers fire; medium = immediate + high_risk;
    # high = immediate + high_risk + existential exploration flags
    sensitivity: medium
    hotline: "400-161-9995"
    immediate_keywords:
      - "我要自杀"
      - "我要跳楼"
      - "割腕自杀"
      - "吃安眠药自杀"
      - "结束生命"
      - "自残"
      - "不想活了"
    high_risk_keywords:
      - "想死"
      - "活不下去"
      - "一了百了"
      - "活着没意义"
      - "再见这个世界"
      - "我走了（永别）"

  # --- Medical Advice Blocking ---
  medical:
    enabled: true
    # high  = strict; medium = warn but don't block; low = log only
    sensitivity: high
    blocklist_words: []
    # Regex patterns that will REJECT the response wholesale
    block_patterns:
      - "建议[^。！？\\n]{0,20}服用[^。！？\\n]{0,10}药"
      - "你(很可能|应该|一定|可能)患有"

  # --- Psychological Disclaimer ---
  disclaimer:
    enabled: true
    # Whether to always append disclaimer to psychological responses
    auto_append: true
    text: |
      > 💚 我只是AI，能陪你聊天，但不能替代真正的心理咨询。
      如果你觉得需要更专业的帮助，学校心理健康中心随时为你开放，
      全国心理援助热线 **400-161-9995** 也是24小时免费的。

  # --- LLM Input Guard ---
  llm_guard:
    enabled: true
    sensitivity: medium
    # Custom blocklist of words/patterns the LLM input guard should catch
    extra_blocklist: []

  # --- Citation Enforcement ---
  citation:
    enabled: true
    # Whether to warn when policy/data responses lack source citations
    warn_missing_citation: true

