# CQUPT AI Assistant — Safety Guardrails Configuration
# Tune per-layer enable/disable, sensitivity, and custom blocklists.

layers:
  # --- Crisis Detection ---
  # Three-tier classification: immediate > high_risk > existential
  crisis:
    enabled: true
    # low = only immediate triggers fire; medium = immediate + high_risk;
    # high = immediate + high_risk + existential exploration flags
    sensitivity: medium
    hotline: "400-161-9995"
    immediate_keywords:
      - "自杀"
      - "跳楼"
      - "割腕"
      - "吃安眠药"
      - "结束生命"
      - "自残"
      - "不想活了"
      - "我要死"
      - "上吊"
      - "同归于尽"
      - "活够了"
    high_risk_keywords:
      - "想死"
      - "活不下去"
      - "一了百了"
      - "活着没意义"
      - "再见这个世界"
      - "我走了（永别）"
      - "生不如死"
      - "死了一了百了"
      - "另一个世界"
      - "离开这个世界"
      - "去天堂吧"
      - "下辈子"
      - "来生"
      - "活着好累"
    # 隐晦轻生表达——需要上下文约束，不能做裸关键词匹配
    high_risk_patterns:
      - "好想.*(?:另一个世界|去那边|离开这里|消失|不存在)"
      - "(?:如果|要是|觉得|感觉|也许|可能).*没有我.*(?:更好|更轻松|更快乐|无所谓)"
      - "(?:我.*消失了|消失.*我).*(?:记得|怀念|想)"
      - "那边.*(?:风景|世界|生活).*(?:怎么样|会不会|是不是|一定)"
      - "(?:活着|活|过得|真的).*好?累[，。！？\\s]*(?:不知道|还能|怎么|什么|多久|坚持)"
      - "(?:不想|不要|不想再).*(?:待|留|活)在.*(?:这里|世上|这个世界)"
      - "(?:我|真的|已经).*(?:撑不住|撑不下去|受不了|熬不住|坚持不住)"
      - "要是.*(?:能|可以).*(?:消失|离开|不再醒来|一觉不醒)"
      - "(?:不知道|不确定).*(?:还能|可以).*(?:坚持|撑|熬|活)多久"

  # --- Medical Advice Blocking ---
  medical:
    enabled: true
    # high  = strict; medium = warn but don't block; low = log only
    sensitivity: high
    blocklist_words: []
    # Regex patterns that will REJECT the response wholesale
    block_patterns:
      - "(建议|推荐|提议)[^。！？\\n]{0,30}(服用|吃|购买|试试|用)[^。！？\\n]{0,30}"
      - "你(很可能|应该|一定|可能)患有"
      - "(推荐|建议)[^。！？\\n]{0,20}(药|药物|药品|用药)"

  # --- Psychological Disclaimer ---
  disclaimer:
    enabled: true
    # Whether to always append disclaimer to psychological responses
    auto_append: true
    text: |
      > 💚 我只是AI，能陪你聊天，但不能替代真正的心理咨询。
      如果你觉得需要更专业的帮助，学校心理健康中心随时为你开放，
      全国心理援助热线 **400-161-9995** 也是24小时免费的。

  # --- LLM Semantic Guard ---
  # LLM语义护栏——兜底规则漏掉的谐音/拼音/英文/隐喻/文化引用
  # 只在规则层放行时触发，控制API成本
  semantic:
    enabled: true
    # 检测到的风险等级: high_risk（温和拦截+热线）| immediate（阻断）
    risk_level: high_risk

  # --- LLM Input Guard ---
  llm_guard:
    enabled: true
    sensitivity: medium
    # Custom blocklist of words/patterns the LLM input guard should catch
    extra_blocklist: []

  # --- Citation Enforcement ---
  citation:
    enabled: true
    # Whether to warn when policy/data responses lack source citations
    warn_missing_citation: true

