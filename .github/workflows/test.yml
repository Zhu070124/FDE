name: Smoke Test
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml fastapi
      - run: python -c "compile(open('backend/main.py', encoding='utf-8').read(), 'main.py', 'exec'); print('main.py OK')"
      - run: python -c "compile(open('backend/intent_router.py', encoding='utf-8').read(), 'intent_router.py', 'exec'); print('intent_router.py OK')"
      - run: python -c "compile(open('backend/guardrails.py', encoding='utf-8').read(), 'guardrails.py', 'exec'); print('guardrails.py OK')"
      - run: python -c "compile(open('backend/auth.py', encoding='utf-8').read(), 'auth.py', 'exec'); print('auth.py OK')"
