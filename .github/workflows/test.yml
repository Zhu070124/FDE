name: Smoke Test
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install fastapi uvicorn httpx pyyaml python-dotenv bcrypt pyjwt
      - run: python -c "compile(open('backend/main.py').read(), 'backend/main.py', 'exec'); print('OK: main.py')"
      - run: python -c "compile(open('backend/guardrails.py').read(), 'backend/guardrails.py', 'exec'); print('OK: guardrails.py')"
      - run: python -c "compile(open('backend/vector_store.py').read(), 'backend/vector_store.py', 'exec'); print('OK: vector_store.py')"
      - run: python -c "compile(open('backend/auth.py').read(), 'backend/auth.py', 'exec'); print('OK: auth.py')"
